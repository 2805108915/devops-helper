code: ssh-port-change
name: 修改 SSH 端口
topic: linux
difficulty: 2
sortOrder: 72
tags: [ssh]
timeLimitMinutes: 40
scenario: |
  安全加固：SSH 改用 2222 端口。
  任务：把 sshd 监听端口改为 2222 并重启 sshd，使 sshpass -p lab123 ssh -p 2222 appuser@127.0.0.1 通过（appuser 密码 lab123 已配好）。
setup: |
  id -u appuser >/dev/null 2>&1 || useradd -m -s /bin/bash appuser
  echo "appuser:lab123" | chpasswd
  mkdir -p /run/sshd
  pkill -x sshd 2>/dev/null; sleep 1; /usr/sbin/sshd
check: |
  out=$(sshpass -p lab123 ssh -p 2222 -o StrictHostKeyChecking=no -o ConnectTimeout=5 appuser@127.0.0.1 'echo SSH2222_OK' 2>/dev/null)
  if [ "$out" = "SSH2222_OK" ]; then
    echo '{"pass":true,"score":100,"message":"完成！非默认端口加固"}'
  else
    echo '{"pass":false,"score":0,"message":"sshd_config 加/改 Port 2222 后重启 sshd"}'
  fi
hints:
  - sshd_config：Port 2222（加一行即可）
  - pkill -x sshd 后 /usr/sbin/sshd
  - ssh -p 2222 验证
solution: |
  echo "Port 2222" >> /etc/ssh/sshd_config
  pkill -x sshd; sleep 1; /usr/sbin/sshd
  ss -tlnp | grep 2222
  sshpass -p lab123 ssh -p 2222 -o StrictHostKeyChecking=no appuser@127.0.0.1 whoami
