code: linux-ssh-login
name: SSH 登录失败排查
topic: linux
difficulty: 2
sortOrder: 7
tags: [ssh, sshd, 排障]
timeLimitMinutes: 45
scenario: |
  新同事 appuser 反馈无法 SSH 登录这台服务器（密码登录被拒绝）。
  要求：登录密码统一为 lab123。

  你的任务：
  1. 给 appuser 设置密码 lab123
  2. 排查为什么密码登录失败（sshd 配置）
  3. 修复并重载 sshd，使密码登录成功（可用 sshpass 自测）
setup: |
  id -u appuser >/dev/null 2>&1 || useradd -m -s /bin/bash appuser
  mkdir -p /run/sshd
  sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
  grep -q '^PasswordAuthentication' /etc/ssh/sshd_config || echo 'PasswordAuthentication no' >> /etc/ssh/sshd_config
  /usr/sbin/sshd
check: |
  out=$(sshpass -p lab123 ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 appuser@127.0.0.1 'echo SSH_OK' 2>/dev/null)
  if [ "$out" = "SSH_OK" ]; then
    echo '{"pass":true,"score":100,"message":"完成！appuser 已可通过 SSH 密码登录"}'
  else
    echo '{"pass":false,"score":0,"message":"未达标：sshpass -p lab123 ssh appuser@127.0.0.1 仍失败。检查：密码是否为 lab123？sshd_config 是否允许密码登录？是否重载了 sshd？"}'
  fi
hints:
  - 设密码：passwd appuser（或 echo 'appuser:lab123' | chpasswd）
  - 看配置：grep -i passwordauthentication /etc/ssh/sshd_config
  - 改成 yes 后重载：kill -HUP $(pgrep -x sshd) 或直接重启 sshd
  - 自测：sshpass -p lab123 ssh appuser@127.0.0.1 'whoami'
solution: |
  echo 'appuser:lab123' | chpasswd
  sed -i 's/^PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
  kill -HUP "$(cat /run/sshd.pid)"        # 或 pkill -HUP -x sshd
  sshpass -p lab123 ssh -o StrictHostKeyChecking=no appuser@127.0.0.1 'whoami'
