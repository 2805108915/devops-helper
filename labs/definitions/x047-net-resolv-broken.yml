code: net-resolv-broken
name: DNS 配置损坏
topic: network
difficulty: 1
sortOrder: 47
tags: [DNS]
timeLimitMinutes: 30
scenario: |
  域名解析全部失败（ping IP 正常）。
  任务：修复 /etc/resolv.conf 使 nameserver 为 223.5.5.5（容器场景 DNS 走宿主转发，判分看配置文件内容正确）。
setup: |
  echo "nameserver 300.300.300.300" > /etc/resolv.conf
check: |
  if grep -q "nameserver 223.5.5.5" /etc/resolv.conf && ! grep -q "300.300" /etc/resolv.conf; then
    echo '{"pass":true,"score":100,"message":"完成！DNS 配置修复"}'
  else
    echo '{"pass":false,"score":0,"message":"/etc/resolv.conf 需要 nameserver 223.5.5.5"}'
  fi
hints:
  - 看配置：cat /etc/resolv.conf
  - 写法：nameserver 223.5.5.5
  - echo 或 vi 修改
solution: |
  cat /etc/resolv.conf
  echo "nameserver 223.5.5.5" > /etc/resolv.conf
  cat /etc/resolv.conf
