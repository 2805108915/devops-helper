code: ssh-config-syntax
name: sshd 配置语法错
topic: linux
difficulty: 2
sortOrder: 75
tags: [ssh, 排障]
timeLimitMinutes: 40
scenario: |
  改完 sshd 配置服务起不来了。
  任务：用 sshd -t 找到坏行修复，重启 sshd 并确保 appuser（密码 lab123）能登录。
setup: |
  id -u appuser >/dev/null 2>&1 || useradd -m -s /bin/bash appuser
  echo "appuser:lab123" | chpasswd
  mkdir -p /run/sshd
  echo "PermitRootLocks yes" >> /etc/ssh/sshd_config   # 坏指令
  pkill -x sshd 2>/dev/null; echo ok
check: |
  t=$(sshd -t 2>&1 | wc -l)
  run=$(pgrep -x sshd | wc -l)
  ok=$(sshpass -p lab123 ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 appuser@127.0.0.1 'echo OK' 2>/dev/null)
  if [ "$t" -eq 0 ] && [ "$run" -ge 1 ] && [ "$ok" = "OK" ]; then
    echo '{"pass":true,"score":100,"message":"完成！语法修复服务恢复"}'
  else
    echo '{"pass":false,"score":0,"message":"sshd -t 定位坏行删除，再启动 /usr/sbin/sshd"}'
  fi
hints:
  - sshd -t 输出坏行行号
  - 删掉那一行（sed 或 vi）
  - 再次 sshd -t 通过后 /usr/sbin/sshd
solution: |
  sshd -t
  sed -i "/PermitRootLocks/d" /etc/ssh/sshd_config
  sshd -t && /usr/sbin/sshd
  sshpass -p lab123 ssh -o StrictHostKeyChecking=no appuser@127.0.0.1 whoami
