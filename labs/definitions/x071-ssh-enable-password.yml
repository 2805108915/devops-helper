code: ssh-enable-password
name: 启用 SSH 密码登录
topic: linux
difficulty: 2
sortOrder: 71
tags: [ssh]
timeLimitMinutes: 40
scenario: |
  新机器 sshd 配置禁了密码登录，且 appuser 没密码。
  任务：设 appuser 密码为 lab123、开启 PasswordAuthentication、启动 sshd，使 sshpass 免密自测通过。
setup: |
  id -u appuser >/dev/null 2>&1 || useradd -m -s /bin/bash appuser
  mkdir -p /run/sshd
  sed -i "s/^#\?PasswordAuthentication.*/PasswordAuthentication no/" /etc/ssh/sshd_config
  grep -q "^PasswordAuthentication" /etc/ssh/sshd_config || echo "PasswordAuthentication no" >> /etc/ssh/sshd_config
  pkill -x sshd 2>/dev/null; sleep 1; /usr/sbin/sshd
check: |
  out=$(sshpass -p lab123 ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 appuser@127.0.0.1 'echo SSH_OK' 2>/dev/null)
  if [ "$out" = "SSH_OK" ]; then
    echo '{"pass":true,"score":100,"message":"完成！密码登录打通"}'
  else
    echo '{"pass":false,"score":0,"message":"chpasswd + 改配置 + 重启 sshd（pkill 后 /usr/sbin/sshd）"}'
  fi
hints:
  - 设密码：echo "appuser:lab123" | chpasswd
  - sed 改 PasswordAuthentication yes
  - 重启：pkill -x sshd; /usr/sbin/sshd
solution: |
  echo "appuser:lab123" | chpasswd
  sed -i "s/^PasswordAuthentication no/PasswordAuthentication yes/" /etc/ssh/sshd_config
  pkill -x sshd; sleep 1; /usr/sbin/sshd
  sshpass -p lab123 ssh -o StrictHostKeyChecking=no appuser@127.0.0.1 whoami
