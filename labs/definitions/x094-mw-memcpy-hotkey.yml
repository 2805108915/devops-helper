code: mw-memcpy-hotkey
name: 热点key模拟与本地缓存
topic: mw
difficulty: 3
sortOrder: 94
tags: [综合]
timeLimitMinutes: 45
scenario: |
  Redis 中 hot:key 被高频读取。任务：1) 启动 redis 并 set hot:key v1 2) 用循环读 1000 次 3) 把 QPS（次/秒）计算写入 /root/qps.txt。
setup: |
  pkill -x redis-server 2>/dev/null; sleep 1
  cat > /etc/redis/redis.conf <<EOF
  bind 127.0.0.1
  port 6379
  daemonize yes
  logfile /var/log/redis/redis.log
  dir /var/lib/redis
  EOF
  mkdir -p /var/log/redis /var/lib/redis
check: |
  if [ -f /root/qps.txt ] && grep -qE "[0-9]+" /root/qps.txt && redis-cli exists hot:key 2>/dev/null | grep -q 1; then
    echo '{"pass":true,"score":100,"message":"完成！压测数据生成"}'
  else
    echo '{"pass":false,"score":0,"message":"启动redis；写hot:key；循环1000次计时算QPS"}'
  fi
hints:
  - 启动 redis；set hot:key v1
  - start=$(date +%s%N) ... 循环 get ... end
  - QPS = 1000/耗时秒
solution: |
  redis-server /etc/redis/redis.conf; sleep 1
  redis-cli set hot:key v1
  S=$(date +%s%N); for i in $(seq 1 1000); do redis-cli get hot:key >/dev/null; done; E=$(date +%s%N)
  echo "QPS = 1000 / $(( (E-S)/1000000000 )).$(( ((E-S)/100000000)%10 ))s" | tee /root/qps.txt
